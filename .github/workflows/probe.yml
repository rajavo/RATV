name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe data')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "RATV probe"
          git config user.email "noreply@anthropic.com"
          python3 probe.py
