name: RA Net

# Builds RA Net (net/), checks it on an Android TV emulator, then publishes RANet.apk.
# Results of the check go to the ci-net-results branch.
on:
  push:
    branches: [ main ]
    paths:
      - 'net/**'
      - '.github/workflows/net.yml'
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a run still in progress, so only the latest version is published.
concurrency:
  group: ranet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon -p net :app:testReleaseUnitTest :app:assembleRelease :probe:assembleDebug 2>&1 | tee build.log
      - name: Save the build error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p net-results
          { grep -E "^e: |error:|FAILED|AssertionError" build.log | head -60; echo ----; tail -80 build.log; } > net-results/build-error.txt || true
          for f in $(find net/app/build/test-results -name "*.xml" 2>/dev/null); do grep -q "<failure" "$f" && cat "$f" >> net-results/build-error.txt; done; true
          cd net-results && git init -q && git checkout -q -b results && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "RA Net build error (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" results:ci-net-results
      - uses: actions/upload-artifact@v4
        with:
          name: net-apks
          path: |
            net/app/build/outputs/apk/release/app-release.apk
            net/probe/build/outputs/apk/debug/probe-debug.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: net-apks
          path: apks
      - name: Test server
        run: |
          mkdir -p /tmp/www && echo ok > /tmp/www/probe.txt
          nohup python3 -m http.server 8000 --directory /tmp/www > /tmp/www.log 2>&1 &
          sleep 1
          curl -s http://127.0.0.1:8000/probe.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check RA Net on the TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 3
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$(find apks -name app-release.apk | head -1)"
            adb install -r "$(find apks -name probe-debug.apk | head -1)"
            python3 net/ci/smoke_net.py
      - name: Save results to the ci-net-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p net-results
          cp /tmp/www.log net-results/server.log 2>/dev/null || true
          cd net-results && git init -q && git checkout -q -b results && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "RA Net test results (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" results:ci-net-results

  publish:
    needs: emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: net-apks
          path: apks
      - name: Publish to the net-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find apks -name app-release.apk | head -1)" RANet.apk
          # One release named "net-latest" whose file is swapped, so the download link never changes.
          git push -f origin HEAD:refs/tags/net-latest
          if gh release view net-latest >/dev/null 2>&1; then
            gh release upload net-latest RANet.apk --clobber
          else
            gh release create net-latest RANet.apk --title "RA Net" --latest=false \
              --notes "تطبيق RA Net للتلفزيون: النت كله للتطبيق اللي على الشاشة. نزّل RANet.apk وثبّته."
          fi
          # The version, for RA Store to tell when an update is out.
          printf '{"versionCode": %s, "versionName": "1.0.%s", "apk": "RANet.apk", "package": "com.ratv.net"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > version.json
          gh release upload net-latest version.json --clobber
          gh release edit net-latest --draft=false --prerelease=false --title "RA Net" --latest=false
      - name: Check the public download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/net-latest/RANet.apk"
          for i in 1 2 3 4 5 6; do
            if curl -fsIL -o /dev/null "$url"; then echo "Download link works: $url"; exit 0; fi
            gh release edit net-latest --draft=false --prerelease=false || true
            sleep 20
          done
          echo "Download link still not public: $url"
          exit 1
