name: Build APK

on:
  push:
    branches: [ main, master ]
    # RA Net (net/), RA Home (home/), RA Store (store/), جدول RA كورة (kora/) and the free channels list have their own workflows:
    # changing them must not publish a new RATV for the customers. Edits of this file alone do not
    # publish either; run it by hand (workflow_dispatch) if needed.
    # README.md is only text: a change to it does not publish either.
    # A commit whose message has [silent] publishes a silent build (see "Silent or announced" below).
    paths-ignore:
      - 'net/**'
      - 'kora/**'
      - 'home/**'
      - 'store/**'
      - '.github/workflows/home.yml'
      - '.github/workflows/store.yml'
      - '.github/workflows/net.yml'
      - '.github/workflows/kora.yml'
      - '.github/workflows/kora-data.yml'
      - '.github/workflows/free-channels.yml'
      - '.github/workflows/build.yml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      silent:
        description: 'Silent: the APK at the download link is replaced, and the update notice stays as it is'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A silent build replaces the APK at the download link and nothing else: the version file and the
      # release notes stay as they were, so the app shows no update notice to anyone. Whoever downloads
      # the APK from the link gets it.
      - name: Silent or announced
        id: mode
        env:
          COMMIT: ${{ github.event.head_commit.message }}
          SILENT_INPUT: ${{ inputs.silent }}
        run: |
          if [ "$SILENT_INPUT" = "true" ] || printf '%s' "$COMMIT" | grep -qF '[silent]'; then
            echo "silent=true" >> "$GITHUB_OUTPUT"
            echo "Silent build: the update notice stays as it is."
          else
            echo "silent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -ParmOnly assembleDebug

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew --no-daemon -ParmOnly assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RATV-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SILENT: ${{ steps.mode.outputs.silent }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk RATV.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk RATV.apk
          fi
          # Keep one release named "latest" and only swap its file, so the download link
          # (and the Downloader code) never changes and never disappears.
          git push -f origin HEAD:refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest RATV.apk --clobber
          else
            gh release create latest RATV.apk --title "RATV" --notes "أحدث نسخة من تطبيق RATV — نزّل ملف RATV.apk وثبّته على جوالك."
          fi
          if [ "$SILENT" = "true" ]; then
            echo "Silent build: only the APK is replaced. The version file and the release notes stay as they are."
            exit 0
          fi
          # Read by the app's "update" button to know a newer version is out.
          # With what the version fixes (release-notes.json), which the app shows before updating.
          notes='{}'
          if [ -f release-notes.json ]; then notes=$(jq -c . release-notes.json); fi
          jq -n --argjson code ${{ github.run_number }} --argjson notes "$notes" \
            '{versionCode: $code, versionName: ("1.0." + ($code | tostring)), apk: "RATV.apk", notes: $notes}' > version.json
          cat version.json
          # The version file goes up last, so the app never offers a version whose APK is not there yet.
          gh release upload latest version.json --clobber
          gh release edit latest --draft=false --prerelease=false --title "RATV"
          # The release page lists the same notes.
          body=$(jq -r '(.notes.ar // []) | map("• " + .) | join("\n")' version.json)
          gh release edit latest --notes "$(printf 'RA TV 1.0.%s\n\n%s' "${{ github.run_number }}" "$body")" || true

      - name: Check the public download link
        env:
          GH_TOKEN: ${{ github.token }}
          SILENT: ${{ steps.mode.outputs.silent }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/latest/RATV.apk"
          for i in 1 2 3 4 5 6; do
            if curl -fsIL -o /dev/null "$url" && { [ "$SILENT" = "true" ] || curl -fsL "${url%/*}/version.json" | grep -q '"versionCode": ${{ github.run_number }}'; }; then
              echo "Download link works: $url"; exit 0
            fi
            echo "Link not public yet, publishing the release again"
            gh release edit latest --draft=false --prerelease=false || true
            sleep 20
          done
          echo "Download link still not public: $url"
          exit 1
