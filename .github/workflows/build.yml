name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RATV-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk RATV.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk RATV.apk
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RATV.apk --title "RATV" --notes "أحدث نسخة من تطبيق RATV — نزّل ملف RATV.apk وثبّته على جوالك."
