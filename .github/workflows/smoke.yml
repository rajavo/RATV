name: Smoke test

# Temporary end-to-end check on Android emulators (phone and TV) against a fake provider.
on:
  push:
    branches: [ ci-smoke ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
            script: ci/smoke.py
            hwkeyboard: true
          - device: tv
            api: 30
            target: android-tv
            arch: x86
            profile: tv_1080p
            script: ci/smoke_tv.py
            hwkeyboard: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Prepare test media
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          mkdir -p ci/media
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 240 -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 1200k -g 50 -c:a aac -b:a 96k -f mpegts ci/media/live.ts
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -f lavfi -i sine=frequency=880:sample_rate=48000 -t 240 -map 0:v -map 1:a -map 2:a -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 1200k -g 50 -c:a aac -b:a 96k -metadata:s:a:0 language=ara -metadata:s:a:1 language=eng -f mpegts ci/media/live_multi.ts
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=660:sample_rate=48000 -t 120 -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 1200k -g 50 -c:a aac -b:a 96k -movflags +faststart ci/media/movie.mp4
          for i in 1 2 3 4 5; do
            ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x$(printf '%02x%02x%02x' $((i*45)) $((210-i*30)) $((90+i*25))):s=256x256" -frames:v 1 ci/media/l$i.png
          done

      - name: Start mock IPTV server
        run: |
          nohup python3 ci/mock_server.py > ci/server.log 2>&1 &
          sleep 2
          curl -s "http://127.0.0.1:8000/player_api.php?username=test&password=test" | head -c 200; echo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the ${{ matrix.device }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_OUT: smoke-results/${{ matrix.device }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 3
          ram-size: 3072M
          disable-animations: false
          enable-hw-keyboard: ${{ matrix.hwkeyboard }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/apk/release/app-release.apk || adb install -r apk/app-release.apk
            python3 ${{ matrix.script }}

      - name: Save results to the branch
        if: always()
        run: |
          mkdir -p smoke-results/${{ matrix.device }}
          cp ci/server.log smoke-results/${{ matrix.device }}/server.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f smoke-results
          git commit -q -m "Smoke test results (${{ matrix.device }})" || true
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin ci-smoke && git push -q origin HEAD:ci-smoke && break
            sleep 5
          done
